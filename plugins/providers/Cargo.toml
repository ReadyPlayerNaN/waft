[package]
name = "waft-plugin-providers"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "waft-providers-daemon"
path = "bin/waft-providers-daemon.rs"

[dependencies]
waft-plugin = { path = "../../crates/plugin" }
waft-protocol = { path = "../../crates/protocol" }
anyhow = "1"
async-trait = "0.1"
dirs = "6"
futures = "0.3"
log = "0.4"
quotas = "=0.11.0"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"

[dev-dependencies]
chrono = "0.4"

[lints]
workspace = true
