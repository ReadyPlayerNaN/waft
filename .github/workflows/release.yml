name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing semver tag to release, e.g. v1.2.3'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-release:
    name: build and publish release assets
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate tag format
        id: version
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            cargo git rust pkgconf \
            gtk4 libadwaita gtk4-layer-shell \
            glib2 dbus libsoup3 cairo pango gdk-pixbuf2 graphene

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Run release validation tests
        run: |
          cargo test --locked -p waft-protocol -p waft-config -p waft-plugin -p waft-plugin-power
          cargo test --locked -p waft --lib
          cargo test --locked -p waft --test tier1_entity_routing
          cargo test --locked -p waft --test tier2_action_routing
          cargo test --locked -p waft --test tier2_multi_subscriber
          cargo test --locked -p waft --test tier3_protocol_hardening
          cargo test --locked -p waft-overview -p waft-settings -p waft-launcher

      - name: Build release binaries
        run: |
          export CARGO_TARGET_DIR=target
          mapfile -t plugin_bins < <(
            awk '
              /^\[\[bin\]\]/ { in_bin = 1; next }
              /^\[/          { in_bin = 0 }
              in_bin && /^name[[:space:]]*=/ {
                sub(/^[^"]*"/, "")
                sub(/".*$/,   "")
                print
              }
            ' plugins/*/Cargo.toml
          )

          bin_args=(--bin waft --bin waft-overview --bin waft-settings --bin waft-launcher)
          for bin in "${plugin_bins[@]}"; do
            bin_args+=(--bin "$bin")
          done

          cargo build --locked --release "${bin_args[@]}"

      - name: Assemble release archive
        run: |
          version='${{ steps.version.outputs.value }}'
          bundle="waft-${version}-x86_64"
          mkdir -p "$bundle/bin" \
                   "$bundle/share/dbus-1/services" \
                   "$bundle/lib/systemd/user" \
                   "$bundle/share/applications"

          install -Dm755 target/release/waft "$bundle/bin/waft"
          install -Dm755 target/release/waft-overview "$bundle/bin/waft-overview"
          install -Dm755 target/release/waft-settings "$bundle/bin/waft-settings"
          install -Dm755 target/release/waft-launcher "$bundle/bin/waft-launcher"
          for binary in target/release/waft-*-daemon; do
            install -Dm755 "$binary" "$bundle/bin/$(basename "$binary")"
          done
          install -Dm644 data/org.waft.Daemon.service "$bundle/share/dbus-1/services/org.waft.Daemon.service"
          install -Dm644 data/waft.service "$bundle/lib/systemd/user/waft.service"
          install -Dm644 data/waft-settings.desktop "$bundle/share/applications/waft-settings.desktop"
          install -Dm644 LICENSE "$bundle/LICENSE"

          tar -czf "$bundle.tar.gz" "$bundle"
          sha256sum "$bundle.tar.gz" > "$bundle.tar.gz.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            waft-${{ steps.version.outputs.value }}-x86_64.tar.gz
            waft-${{ steps.version.outputs.value }}-x86_64.tar.gz.sha256
