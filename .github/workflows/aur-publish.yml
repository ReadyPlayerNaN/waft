name: aur-publish

# Pushes the waft-git PKGBUILD to its AUR repository.
#
# Triggers:
#   - push to master affecting packaging files or these workflows
#   - tag push matching `release/*`
#   - manual dispatch
#
# Required repository secrets:
#   AUR_SSH_PRIVATE_KEY  - private key registered with the AUR account
#                         that owns the packages.

on:
  push:
    branches: [master]
    paths:
      - 'packaging/**'
      - '.github/workflows/packaging.yml'
      - '.github/workflows/aur-publish.yml'
    tags:
      - 'release/*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        default: 'waft-git'
        type: choice
        options:
          - waft-git

jobs:
  publish:
    name: publish ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - waft-git
    steps:
      - name: Skip non-matching package on manual dispatch
        if: >
          github.event_name == 'workflow_dispatch'
          && github.event.inputs.package != matrix.pkg
        run: echo "skipped" && exit 0

      - uses: actions/checkout@v4

      - name: Resolve commit message
        id: msg
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=Update to ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=Manual publish from ${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish ${{ matrix.pkg }} to AUR
        if: >
          github.event_name != 'workflow_dispatch'
          || github.event.inputs.package == matrix.pkg
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: ${{ matrix.pkg }}
          pkgbuild: packaging/${{ matrix.pkg }}/PKGBUILD
          commit_username: ${{ vars.AUR_USERNAME || 'just-paja' }}
          commit_email: ${{ vars.AUR_EMAIL || 'just.paja@gmail.com' }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.msg.outputs.value }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
          updpkgsums: false
          allow_empty_commits: true
