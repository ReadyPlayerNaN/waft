name: aur-publish

# Pushes AUR PKGBUILDs for waft packages.
#
# Triggers:
#   - successful `packaging` workflow run on master -> waft-git
#   - published GitHub Release -> waft-bin
#   - manual dispatch
#
# Required repository secrets:
#   AUR_SSH_PRIVATE_KEY  - private key registered with the AUR account
#                         that owns the packages.

on:
  workflow_run:
    workflows: ["packaging"]
    types: [completed]
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        default: 'waft-git'
        type: choice
        options:
          - waft-git
          - waft-bin
      tag:
        description: 'Release tag for waft-bin, e.g. v1.2.3'
        required: false
        type: string

jobs:
  publish-git:
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.package == 'waft-git')
    name: publish waft-git
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve commit message
        id: msg
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "value=Sync PKGBUILD from master (${{ github.event.workflow_run.head_sha }})" >> "$GITHUB_OUTPUT"
          else
            echo "value=Manual publish from ${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish waft-git to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: waft-git
          pkgbuild: packaging/waft-git/PKGBUILD
          commit_username: ${{ vars.AUR_USERNAME || 'just-paja' }}
          commit_email: ${{ vars.AUR_EMAIL || 'just.paja@gmail.com' }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.msg.outputs.value }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
          updpkgsums: false
          allow_empty_commits: true

  publish-bin:
    if: >
      github.event_name == 'release'
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.package == 'waft-bin')
    name: publish waft-bin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        env:
          TAG_NAME: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          if [[ -z "$TAG_NAME" ]]; then
            echo "tag input is required for manual waft-bin publish" >&2
            exit 1
          fi
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "expected semver tag like v1.2.3, got: $TAG_NAME" >&2
            exit 1
          fi

          version="${TAG_NAME#v}"
          checksum_url="https://github.com/ReadyPlayerNaN/waft/releases/download/${TAG_NAME}/waft-${version}-x86_64.tar.gz.sha256"

          checksum=''
          for _ in {1..30}; do
            checksum="$(curl -fsSL "$checksum_url" 2>/dev/null | awk '{print $1}' || true)"
            if [[ -n "$checksum" ]]; then
              break
            fi
            sleep 10
          done
          if [[ -z "$checksum" ]]; then
            echo "failed to resolve release checksum from $checksum_url" >&2
            exit 1
          fi

          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Render waft-bin PKGBUILD
        run: |
          chmod +x packaging/render-waft-bin-pkgbuild.sh
          packaging/render-waft-bin-pkgbuild.sh \
            '${{ steps.meta.outputs.version }}' \
            '${{ steps.meta.outputs.checksum }}' \
            packaging/waft-bin/PKGBUILD

      - name: Resolve commit message
        id: msg
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "value=Publish waft-bin ${{ steps.meta.outputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=Manual publish waft-bin ${{ steps.meta.outputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish waft-bin to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: waft-bin
          pkgbuild: packaging/waft-bin/PKGBUILD
          commit_username: ${{ vars.AUR_USERNAME || 'just-paja' }}
          commit_email: ${{ vars.AUR_EMAIL || 'just.paja@gmail.com' }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.msg.outputs.value }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
          updpkgsums: false
          allow_empty_commits: true
